[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling']

[project]
dependencies = [
    'Django==6.1',
    'bokeh==3.9.2',
    'daphne==4.2.3',
    'django-axes[ipware]==8.3.1',
    'djangorestframework==3.18.0',
    'grpcio-tools==1.83.0',
    'grpcio==1.83.0',
    'pandas==3.0.5'
]
name = 'ui'
version = '0.1.0'

[tool.black]
extend-exclude = '.*_pb2\.py|.*_pb2_grpc\.py'

[tool.hatch.build.targets.wheel]
packages = [
    'src/ui'
]
