[build-system]
build-backend = 'hatchling.build'
requires = ['hatchling']

[project]
dependencies = [
    'Django==6.0.6',
    'bokeh==3.9.1',
    'daphne==4.2.2',
    'django-axes[ipware]==8.3.1',
    'djangorestframework==3.17.1',
    'grpcio-tools==1.81.0',
    'grpcio==1.81.0',
    'pandas==3.0.3'
]
name = 'ui'
version = '0.1.0'

[tool.black]
extend-exclude = '.*_pb2\.py|.*_pb2_grpc\.py'

[tool.hatch.build.targets.wheel]
packages = [
    'src/clients',
    'src/home',
    'src/stats',
    'src/ui',
    'src/xray'
]
